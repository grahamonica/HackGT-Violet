# Violet face-quality (FIQA) dataset builder configuration.
#
# `paths.root` is relative to THIS config file's directory. DATA_ROOT is
# <root>/<data_dir>, overridable with the VIOLET_FIQA_DATA_DIR env var.
# Source paths below are relative to DATA_ROOT.

paths:
  root: ..            # -> ml/facequality/dataset
  data_dir: data      # everything generated lives here (gitignored)

random_seed: 42

# ---------------------------------------------------------------------------
# Source dataset
# ---------------------------------------------------------------------------
source:
  type: celeba
  celeba:
    # Paths are relative to DATA_ROOT. Missing files are fetched from this
    # Hugging Face dataset mirror of the official release. CelebA must be used
    # under its own license terms (non-commercial research).
    hf_repo: Yuehao/celeba
    raw_dir: raw/celeba
    images_zip: img_align_celeba.zip
    images_dir: raw/celeba/img_align_celeba
    identity_file: raw/celeba/identity_CelebA.txt
    landmarks_file: raw/celeba/list_landmarks_align_celeba.txt
    bbox_file: raw/celeba/list_bbox_celeba.txt
    attr_file: raw/celeba/list_attr_celeba.txt

# ---------------------------------------------------------------------------
# Identity filtering / capping / splitting
# ---------------------------------------------------------------------------
selection:
  min_images_per_identity: 10
  # Caps applied AFTER filtering + the seeded shuffle; the selection is the
  # shortest prefix of that fixed order satisfying both (null = no limit).
  # Eligible CelebA: 8369 identities, 193k images, ~23 images/identity.
  # Growing either cap only ADDS identities; existing splits never change.
  # Test the pipeline first with: --max-identities 30
  max_identities: null
  target_images: 10000       # -> 429 identities / 10,010 images at seed 42

splits:
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15

# ---------------------------------------------------------------------------
# Crops (no detector: sources ship 5-point landmarks)
# ---------------------------------------------------------------------------
crop:
  # none:  use source images as-is (CelebA img_align_celeba is already
  #        aligned + cropped, 178x218). crop_path == source_image_path.
  # align: similarity-warp onto the ArcFace 5-point template at crop_size;
  #        for future sources that are not pre-aligned. face_scale is the
  #        fraction of the crop occupied by the canonical 112x112 ArcFace frame.
  mode: none
  crop_size: 224
  face_scale: 0.75
  jpeg_quality: 95

# ---------------------------------------------------------------------------
# Enrollment / reference selection (no downstream model involved)
# ---------------------------------------------------------------------------
enrollment:
  num_images: 3
  # Identities need at least num_images + min_query_images detected faces.
  min_query_images: 3
  # "Sufficiently good" gates for reference candidates. If too few images
  # pass, selection falls back to the best-scoring detected faces.
  min_orig_face_px: 40       # short side of the in-the-wild bbox
  brightness_range: [40, 215]
  max_abs_roll_deg: 25
  max_out_of_frame: 0.05
  # Landmark yaw proxy (see README): 0 == frontal, +/-1 ~ nose at an eye.
  frontal_max_abs_yaw: 0.25
  side_yaw_range: [0.25, 0.8]
  # Minimum dHash Hamming distance between chosen references (near-dup guard).
  min_dhash_distance: 8
  quality_weights:
    sharpness: 0.4
    face_size: 0.3
    exposure: 0.3

# ---------------------------------------------------------------------------
# AWS Rekognition
# ---------------------------------------------------------------------------
aws:
  region: us-east-2
  profile: null              # null -> default boto3 credential resolution
  # Loaded (if present) before boto3 resolves credentials. Never committed.
  env_file: .env
  collection_id: violet-fiqa-training
  # Enrollment
  index_quality_filter: NONE
  associate_user_match_threshold: 0
  # Query labeling: keep low-confidence / poor-quality results on purpose.
  search_user_match_threshold: 0
  search_max_users: 5
  search_quality_filter: NONE
  # An enroll/label run needing more calls than this requires --yes.
  confirm_calls_above: 2000
  # Throughput / resilience
  max_requests_per_second: 5
  max_workers: 4
  max_attempts: 8
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0

# ---------------------------------------------------------------------------
# Sanity report
# ---------------------------------------------------------------------------
report:
  low_similarity_threshold: 80.0   # top-1 similarity below this == low confidence
  ambiguity_margin: 5.0            # top-1 minus top-2 below this == ambiguous
  preview_identities: 30
  preview_queries_per_identity: 6
