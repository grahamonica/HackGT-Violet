# Violet face-quality (FIQA) dataset builder configuration.
#
# Relative paths below are resolved against `paths.root`, which is itself
# relative to THIS config file's directory.

paths:
  root: ..            # -> ml/facequality/dataset
  data_dir: data      # everything generated lives here (gitignored)

random_seed: 42

# ---------------------------------------------------------------------------
# Source dataset
# ---------------------------------------------------------------------------
source:
  type: celeba
  celeba:
    # Downloaded via torchvision.datasets.CelebA (falls back to manual download).
    # torchvision places files under <raw_root>/celeba/.
    raw_root: data/raw
    images_dir: data/raw/celeba/img_align_celeba
    identity_file: data/raw/celeba/identity_CelebA.txt
    landmarks_file: data/raw/celeba/list_landmarks_align_celeba.txt
    bbox_file: data/raw/celeba/list_bbox_celeba.txt
    attr_file: data/raw/celeba/list_attr_celeba.txt

# ---------------------------------------------------------------------------
# Identity filtering / capping / splitting
# ---------------------------------------------------------------------------
selection:
  min_images_per_identity: 10
  # Applied AFTER filtering + deterministic shuffle. null = all eligible.
  # Growing this later only ADDS identities; existing split assignments
  # never change.
  max_identities: null

splits:
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15

# ---------------------------------------------------------------------------
# Face alignment (no detector: CelebA ships 5-point landmarks)
# ---------------------------------------------------------------------------
crop:
  # Output crop is crop_size x crop_size, warped from CelebA's 5-point
  # landmarks onto the ArcFace template. face_scale is the fraction of the crop
  # occupied by the canonical 112x112 ArcFace frame: 1.0 == tight ArcFace crop,
  # smaller == more context. A tighter crop is a centered
  # (crop_size * face_scale) square. 0.75 keeps the warp mostly inside the
  # 178x218 aligned CelebA frame.
  crop_size: 224
  face_scale: 0.75
  jpeg_quality: 95

# ---------------------------------------------------------------------------
# Enrollment / reference selection (no downstream model involved)
# ---------------------------------------------------------------------------
enrollment:
  num_images: 3
  # Identities need at least num_images + min_query_images detected faces.
  min_query_images: 3
  # "Sufficiently good" gates for reference candidates. If too few images
  # pass, selection falls back to the best-scoring detected faces.
  min_orig_face_px: 40       # short side of the in-the-wild bbox
  brightness_range: [40, 215]
  max_abs_roll_deg: 25
  max_out_of_frame: 0.05
  # Landmark yaw proxy (see README): 0 == frontal, +/-1 ~ nose at an eye.
  frontal_max_abs_yaw: 0.25
  side_yaw_range: [0.25, 0.8]
  # Minimum dHash Hamming distance between chosen references (near-dup guard).
  min_dhash_distance: 8
  quality_weights:
    sharpness: 0.4
    face_size: 0.3
    exposure: 0.3

# ---------------------------------------------------------------------------
# AWS Rekognition
# ---------------------------------------------------------------------------
aws:
  region: us-east-2
  profile: null              # null -> default boto3 credential resolution
  # Loaded (if present) before boto3 resolves credentials. Never committed.
  env_file: .env
  collection_id: violet-fiqa-training
  # Enrollment
  index_quality_filter: NONE
  associate_user_match_threshold: 0
  # Query labeling: keep low-confidence / poor-quality results on purpose.
  search_user_match_threshold: 0
  search_max_users: 5
  search_quality_filter: NONE
  # Throughput / resilience
  max_requests_per_second: 5
  max_workers: 4
  max_attempts: 8
  backoff_base_seconds: 1.0
  backoff_max_seconds: 60.0

# ---------------------------------------------------------------------------
# Sanity report
# ---------------------------------------------------------------------------
report:
  low_similarity_threshold: 80.0   # top-1 similarity below this == low confidence
  ambiguity_margin: 5.0            # top-1 minus top-2 below this == ambiguous
  preview_identities: 30
  preview_queries_per_identity: 6
